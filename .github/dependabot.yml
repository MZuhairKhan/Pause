version: 2

# Two ecosystems matter here: the Gradle dependencies the app ships, and the GitHub Actions the
# CI depends on. The Actions half is not cosmetic -- it is what would have caught the Node 20
# deprecation before GitHub started warning about it.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # AndroidX ships many artifacts in lockstep; one PR per artifact would be noise.
      androidx:
        patterns: ["androidx.*"]
      compose:
        patterns: ["androidx.compose*"]
      # Test-only tooling can move independently of anything that ships to users.
      testing:
        patterns:
          - "junit*"
          - "org.robolectric:*"
          - "io.github.takahirom.roborazzi*"
          - "androidx.test*"
    ignore:
      # Pinned deliberately, and tighter than it looks like it needs to be. 1.66+ ships Kotlin 2.3
      # metadata that Kotlin 2.1 cannot read -- but 1.65 also breaks, for an unrelated reason: it
      # moves `captureRoboImage`, so every call in ScreenshotTest.kt stops resolving (#6). The
      # versions between 1.60 and 1.65 are untested, so anything above 1.60 is a deliberate
      # migration rather than a bump. Revisit alongside a Kotlin upgrade.
      - dependency-name: "io.github.takahirom.roborazzi*"
        versions: [">=1.61.0"]
      # core-ktx 1.19.0 requires compileSdk 37; we are on 36. Verified, not assumed:
      # checkDebugAarMetadata fails with "compileSdk of at least 37". The pin was recorded only as
      # a comment in libs.versions.toml, so a bot proposed 1.19.0 anyway (#4). Lift this together
      # with a compileSdk bump.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      # AGP and Kotlin are coupled to each other and to the Gradle wrapper; bumping either from
      # a bot invites a broken build. Upgrade these deliberately, together.
      #
      # These must be the PLUGIN IDS, not the Maven coordinates. Both are declared through the
      # plugins DSL via the version catalog, so that is the name Dependabot matches on: the
      # coordinate-form rules below never fired, which is how "deps: bump kotlin from 2.1.0 to
      # 2.4.10" (#7) got opened against a Kotlin version we pin on purpose.
      - dependency-name: "com.android.application"
      - dependency-name: "org.jetbrains.kotlin.android"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      # Kept as belt-and-braces in case either is ever added as a classpath coordinate instead.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "org.jetbrains.kotlin:*"
      # The wrapper is the third member of that trio and was NOT ignored, so a bot bumped it to
      # 9.7.1 and broke every job on main: Gradle 9.6 removed the internal API AGP 8.13 uses
      # ("Plugin 'com.android.internal.application' relies on ... InternalProblems"). AGP 8.x
      # tops out at Gradle 9.5. It also decides the release APK's bytes, so it cannot move
      # without re-verifying reproducibility.
      - dependency-name: "gradle-wrapper"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
