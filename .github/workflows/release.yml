name: Release

# Cut a release by pushing a version tag:  git tag v0.4.2 && git push origin v0.4.2
# Builds and signs the release APK, then creates a GitHub Release with the APK, its SHA-256,
# and release notes pulled from the matching CHANGELOG.md section. The asset is named
# Pause-<version>.apk, which is what F-Droid's `Binaries:` URL resolves to.
#
# Signing secrets (required — the job fails without them):
#   KEYSTORE_BASE64   base64 of your release keystore  (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD store password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.4.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      # Refuse to publish rather than ship an unsigned APK. It cannot be installed, and F-Droid
      # resolves `Binaries:` to this exact filename — an unsigned or differently-named asset there
      # fails its signature check and stalls the release.
      - name: Require signing secrets
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::No KEYSTORE_BASE64 secret set. A release APK must be signed: an unsigned one cannot be installed, and F-Droid's Binaries: URL expects Pause-<version>.apk signed with the key in AllowedAPKSigningKeys. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD, then re-run."
          exit 1

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test & assemble release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Sign APK
        id: sign
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"

          # Strip whitespace before decoding: a value pasted into the web UI can pick up wrapping
          # or CRLF, and plain `base64 -d` then dies with the unhelpful "invalid input".
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/keystore.jks" || {
            echo "::error::KEYSTORE_BASE64 is not valid base64. Re-set it from the file rather than pasting: gh secret set KEYSTORE_BASE64 < keystore.base64.txt (generate with: base64 -w0 release.jks > keystore.base64.txt)."
            exit 1
          }
          # A truncated or wrong-file secret decodes fine but is not a keystore, and apksigner's
          # error for that is far less obvious than this one.
          magic="$(head -c 2 "$RUNNER_TEMP/keystore.jks" | xxd -p)"
          if [ "$magic" != "3082" ] && [ "$magic" != "feed" ]; then
            echo "::error::KEYSTORE_BASE64 decoded to $(wc -c < "$RUNNER_TEMP/keystore.jks") bytes that are neither PKCS12 nor JKS. The secret is truncated or holds the wrong file."
            exit 1
          fi
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          out="Pause-$VERSION.apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: Checksum & release notes
        id: meta
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          apk="${{ steps.sign.outputs.apk }}"
          sha256sum "$apk" > "$apk.sha256"
          APK_SHA="$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          # Release notes come from the store changelog, not from CHANGELOG.md. The latter is the
          # developer record -- 0.5.0's section alone is ~17k characters -- and dumping it here
          # buries what a user actually wants to know. This file is the user-facing text we
          # already write for F-Droid, so both surfaces say the same short thing.
          code="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n1)"
          store="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          if [ -n "$code" ] && [ -f "$store" ]; then
            {
              echo "## Pause $VERSION"
              echo
              cat "$store"
              echo
              echo "Full technical changelog: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)"
              echo
              echo "\`\`\`"
              echo "SHA-256  $(cut -d' ' -f1 "$APK_SHA")"
              echo "Signing certificate SHA-256  9a251241d05e6acfedaeff3c457574a568278d47c2a6d8d0b22f0ee36689268f"
              echo "\`\`\`"
            } > RELEASE_NOTES.md
            echo "have_notes=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No store changelog at $store; falling back to generated notes."
            echo "have_notes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          APK: ${{ steps.meta.outputs.apk }}
          HAVE_NOTES: ${{ steps.meta.outputs.have_notes }}
        run: |
          set -euo pipefail
          args=(--title "Pause $VERSION" --verify-tag)
          if [ "$HAVE_NOTES" = "1" ]; then
            args+=(--notes-file RELEASE_NOTES.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" "${args[@]}"
