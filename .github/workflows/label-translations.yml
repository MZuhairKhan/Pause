name: Label translation PRs

on:
  # pull_request_target (not pull_request): Weblate opens PRs from a fork, which gets a
  # read-only token under pull_request. This job never checks out or runs the fork's code —
  # it only calls the API to add a label — so the elevated token is safe here.
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.user.login == 'weblate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["translations"],
            });
