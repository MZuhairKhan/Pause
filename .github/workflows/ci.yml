name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Robolectric's SDK 36 (Baklava) sandbox refuses to start on anything below Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

  changelog:
    name: CHANGELOG updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if echo "$changed" | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md updated ✔"
            exit 0
          fi
          # Weblate opens a pull request per language, touching nothing but the translated
          # values-<code>/strings.xml files. There is no changelog entry to write for those:
          # the entry that added the language already covers them. Matching on the paths
          # rather than the bot's username means a human PR cannot slip through by
          # impersonation, and it keeps working if the account is ever renamed. Note that
          # values/strings.xml — the English source — is deliberately not matched, so
          # changing a source string still needs an entry.
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^app/src/main/res/values-[^/]+/strings\.xml$'; then
            echo "Translation-only pull request; no CHANGELOG.md entry needed ✔"
            exit 0
          fi
          echo "::error::CHANGELOG.md was not updated in this PR. Add an entry under [Unreleased]."
          exit 1
