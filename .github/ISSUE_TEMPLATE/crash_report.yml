name: Crash report
description: Pause crashed (the app can fill this in for you)
title: "[Crash] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        After a crash, tap the "Pause stopped" notification and choose Report on GitHub.
        It fills this form in. Filing by hand? Fill every required field.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: This report covers one crash.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing?
    validations:
      required: true
  - type: textarea
    id: crash-log
    attributes:
      label: Crash log
      render: text
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Pause version
    validations:
      required: true
  - type: input
    id: install-source
    attributes:
      label: Installed from
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device model
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM / skin
    validations:
      required: true
  - type: input
    id: permissions
    attributes:
      label: Permissions granted
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Anything else
