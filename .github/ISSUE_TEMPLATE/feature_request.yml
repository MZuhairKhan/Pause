name: Feature request
description: Suggest an idea for Pause
labels: [enhancement]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: This request covers one feature.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Pause to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
